[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer-cv"
version = "0.1.0"
description = "A command-line log analyzer with explainable anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
